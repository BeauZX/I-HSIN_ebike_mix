# 系統指標取樣（功耗 / 頻率 / 降頻 / 負載 / 各階段耗時）
#
# 開了之後每 interval 秒寫一列到 dir 底下的 CSV，結束時印摘要並存 *_summary.txt。
# 命令列 `uv run main.py --metrics` 可以在這裡是 false 時臨時打開。
# 重新產摘要：uv run python -m src.metrics outputs/metrics/<檔名>.csv

enabled: true
interval: 1.0             # 取樣間隔（秒）。每次取樣約 2 次 vcgencmd（各 ~10 ms），1 秒對系統幾乎無影響
dir: outputs/metrics

# 估算參數。Pi 板本身的功耗由 PMIC 實測；Hailo / 相機 / 風扇這台板子沒有電流感測器
# （AI HAT+ 的 hailortcli measure-power 回 UNSUPPORTED），只能用規格值依負載折算，
# 摘要會把「實測」與「估算」分開列。出處與查證日期（2026-09-16）：
#   Hailo-8：官網 typical 2.5 W；M.2 模組板上 INA 實測（Mario Bergeron, Edge AI Power Benchmarking Part 1）
#            ResNet-50 滿載平均 3.96~4.06 W，待機 0.84 W（PCIe ASPM 關）/ 0.51 W（ASPM L1 開；這台 lspci 顯示 L1 Enabled）
#   IMX219：Sony datasheet Table 45，全解析度 30 fps 串流 VANA 33 mA@3.0 V + VDDL 100 mA@1.3 V ≈ 0.23 W（不含相機板穩壓器）
#   Active Cooler：官方產品簡介沒有電流規格（5 V、最高 8000 RPM），0.4 W 為 5 V 小風扇通則估計
#   效率：DA9091 PMIC 無公開 datasheet，0.88 為假設值
estimate:
  hailo_idle_w: 0.5       # Hailo-8 待機（使用率 0%），實測值（ASPM L1 開）
  hailo_full_w: 4.0       # Hailo-8 滿載（使用率 100%），實測值；中間依 hailortcli monitor 的使用率線性內插
  camera_w: 0.25          # IMX219 串流中，datasheet 換算
  fan_full_w: 0.4         # 官方 Active Cooler 全速（估計）；依 PWM 比例折算
  efficiency: 0.88        # PMIC DC-DC 轉換效率（假設）：整套 = (Pi 板 + Hailo + 相機 + 風扇) / efficiency
