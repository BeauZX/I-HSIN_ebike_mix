# 車門開啟 / 關閉偵測（來自 car_door 專案：YOLOv11m，2 類，NMS 已編進模型）
# 與人車偵測共用鏡頭的 lores 640×640 串流（ISP 直接縮放、不耗 CPU），整張畫面偵測。
# 注意：lores 是把 16:9 直接拉成正方形，原專案是 letterbox（等比例縮放補灰邊），畫面比例與原專案不同。
#
# 這顆模型是 multi-context（4 段），在 Hailo 上跟其他模型平分時間；不限頻率全速跑時，
# 實測人車偵測約 32.6→14 次/秒、路面分析約 10.9→4.7 次/秒（2026-09-23）。

hef: models/car_door_yolov11m.hef
conf: 0.4                 # 分數門檻（模型內 NMS 已先用 0.2 過濾）

# HEF 裡沒有類別名稱，順序必須跟訓練時一致。
# 原專案 README 註明此順序是「假設」、尚未驗證：若拿一張確定開門的畫面，框上卻寫 closed，就把兩個對調
class_names: [closed, open]

# 哪些類別算「車門開啟」（畫紅框、狀態列顯示 OPEN）
open_classes: [open]
